services:
  stagematchmap-web:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - API_URL=http://stagematchmap-api:5049
      - DB_CONNECTION_STRING=/app/database_files/users.db

      # SSO Configuration
      - SSO_MODE=${SSO_MODE:-dev}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - APP_AUDIENCE=${APP_AUDIENCE:-stagematchApp}
      - PORTAL_URL=${PORTAL_URL:-http://localhost:5000}
    
       # User and Rate Limiting
      - DEV_USER_EMAIL=${DEV_USER_EMAIL:-demo@example.com}
      - MAX_SESSIONS_PER_USER=${MAX_SESSIONS_PER_USER:-3}
      - MAX_SESSIONS_GLOBAL=${MAX_SESSIONS_GLOBAL:-100}   
    
      # Application Configuration
      - SERVER_SECRET_KEY=${SERVER_SECRET_KEY:-dev-secret-change-in-production}
      - DEBUG=${DEBUG:-False}

      - PRIVACY_POLICY_VERSION=${PRIVACY_POLICY_VERSION:-2026-04-21}
    
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
    depends_on:
      - stagematchmap-api
    volumes:
      - .:/app
      - db_data:/app/database_files

  stagematchmap-api:
    build: .
    command: python server.py
    ports:
      - "5049:5049"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT_API=5049
    volumes:
      - .:/app

volumes:
  db_data:
